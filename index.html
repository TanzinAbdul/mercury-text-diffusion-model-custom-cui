<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Text Diffusion · Real API</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    /* ... (same as before, omitted for brevity) ... */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-body: #0f1117; --bg-card: #1a1d27; --bg-surface: #0d0f15;
      --bg-surface2: #151a23; --bg-sidebar: #13161f; --bg-input: #151a23;
      --border-color: #2b303e; --border-light: #2e3545;
      --text-primary: #d6dbf0; --text-secondary: #8e92ab;
      --text-muted: #4d546d; --text-bright: #e8ebf5;
      --accent: #4f5eff; --accent-glow: rgba(79, 94, 255, 0.25);
      --shadow-card: 0 20px 48px rgba(0,0,0,0.7);
      --shadow-inset: inset 0 8px 14px rgba(0,0,0,0.5);
      --badge-bg: #2a2e3b; --badge-border: #333848;
      --stat-bg: #141924; --stat-border: #2b313f;
      --hover-bg: #2b3245;
      --diffusion-view-bg: #0b0d13;
      --footer-color: #484f66;
      --code-bg: #0d0f15;
      --blockquote-border: #4f5eff;
      --table-border: #2b303e;
      --table-header-bg: #1a1d27;
      --link-color: #6c7bff;
      --sidebar-width: 280px;
    }
    [data-theme="light"] {
      --bg-body: #f0f2f8; --bg-card: #ffffff; --bg-surface: #f5f7fd;
      --bg-surface2: #eef1f8; --bg-sidebar: #e8ebf2; --bg-input: #eef1f8;
      --border-color: #d0d6e5; --border-light: #c8cfe0;
      --text-primary: #1f2336; --text-secondary: #4a4f6b;
      --text-muted: #7a7f9a; --text-bright: #0f1322;
      --accent: #4f5eff; --accent-glow: rgba(79, 94, 255, 0.15);
      --shadow-card: 0 12px 32px rgba(0,0,0,0.08);
      --shadow-inset: inset 0 4px 12px rgba(0,0,0,0.03);
      --badge-bg: #e0e4ef; --badge-border: #c9cfdf;
      --stat-bg: #eef1f8; --stat-border: #d5dbe9;
      --hover-bg: #dce1ee;
      --diffusion-view-bg: #f5f7fd;
      --footer-color: #7a7f9a;
      --code-bg: #eef1f8;
      --blockquote-border: #4f5eff;
      --table-border: #d0d6e5;
      --table-header-bg: #e8ebf2;
      --link-color: #4f5eff;
    }
    body {
      background: var(--bg-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
      transition: background 0.2s, color 0.2s;
    }
    .app-wrapper {
      display: flex;
      gap: 1.5rem;
      max-width: 1400px;
      width: 100%;
      align-items: stretch;
      position: relative;
    }
    .sidebar {
      flex: 0 0 var(--sidebar-width);
      background: var(--bg-sidebar);
      border-radius: 2rem;
      padding: 1.5rem 1rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
      position: sticky;
      top: 1.5rem;
      overflow-x: hidden;
    }
    .sidebar.collapsed {
      flex: 0 0 0;
      padding: 0;
      min-width: 0;
      border: 1px solid transparent;
      box-shadow: none;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .sidebar-expand-btn {
      display: none;
      position: fixed;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .sidebar-expand-btn:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .sidebar-expand-btn.visible {
      display: flex;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding: 0 0.2rem;
      flex-shrink: 0;
    }
    .sidebar-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sidebar-header .header-actions {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }
    .sidebar-header button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
      border-radius: 30px;
      transition: 0.15s;
    }
    .sidebar-header button:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }
    .toggle-sidebar {
      font-size: 1rem !important;
      padding: 0.2rem 0.4rem !important;
    }
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      overflow-y: auto;
    }
    .history-item {
      background: var(--bg-surface);
      border-radius: 1.2rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .history-item:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }
    .history-item .h-prompt {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .history-item .h-time {
      font-size: 0.6rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .history-item .h-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 0 0.2rem;
    }
    .history-item .h-del:hover {
      color: #ff5e7a;
    }
    .history-empty {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
      padding: 1rem 0;
    }
    .card {
      flex: 1;
      background: var(--bg-card);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      transition: background 0.2s, border-color 0.2s;
      min-width: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--text-bright), var(--text-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .badge {
      background: var(--badge-bg);
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid var(--badge-border);
      margin-left: 0.2rem;
    }
    .theme-toggle {
      margin-left: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 40px;
      padding: 0.3rem 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .theme-toggle:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }
    .prompt-input-area {
      background: var(--bg-surface);
      border-radius: 1.8rem;
      padding: 1.2rem 1.6rem;
      border: 1px solid var(--border-color);
      margin-bottom: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      transition: background 0.2s;
    }
    .prompt-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1rem;
    }
    .prompt-label {
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .prompt-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border-radius: 40px;
      border: 1px solid var(--border-light);
      padding: 0.1rem 0.1rem 0.1rem 1.2rem;
      transition: border-color 0.2s;
      min-width: 180px;
    }
    .prompt-input-wrapper:focus-within {
      border-color: var(--accent);
    }
    #promptInput {
      background: transparent;
      border: none;
      padding: 0.6rem 0.4rem 0.6rem 0;
      font-size: 0.95rem;
      color: var(--text-primary);
      width: 100%;
      outline: none;
      font-family: inherit;
    }
    #promptInput::placeholder {
      color: var(--text-muted);
    }
    .prompt-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn-icon {
      background: var(--bg-surface2);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
    }
    .btn-icon:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-primary:hover {
      background: #5d6aff;
      transform: scale(1.02);
    }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
    }
    .stage-badge {
      background: var(--badge-bg);
      padding: 0.25rem 1rem;
      border-radius: 40px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 500;
      border: 1px solid var(--badge-border);
    }
    .prompt-preview {
      color: var(--text-secondary);
      font-size: 0.7rem;
      margin-left: auto;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diffusion-view {
      background: var(--diffusion-view-bg);
      border-radius: 2rem;
      padding: 1.8rem 2rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-inset);
      min-height: 300px;
      margin-bottom: 1.5rem;
      transition: background 0.2s, border-color 0.2s;
      overflow: auto;
      max-height: 70vh;
    }
    .response-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-primary);
    }
    .response-text h1, .response-text h2, .response-text h3, 
    .response-text h4, .response-text h5, .response-text h6 {
      margin: 1.2em 0 0.6em 0;
      color: var(--text-bright);
      font-weight: 600;
      line-height: 1.3;
    }
    .response-text h1 { font-size: 1.8rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.3em; }
    .response-text h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.2em; }
    .response-text h3 { font-size: 1.2rem; }
    .response-text p { margin: 0.8em 0; }
    .response-text ul, .response-text ol { padding-left: 2em; margin: 0.8em 0; }
    .response-text li { margin: 0.3em 0; }
    .response-text blockquote {
      border-left: 4px solid var(--blockquote-border);
      padding-left: 1.2em;
      margin: 1em 0;
      color: var(--text-secondary);
      background: var(--bg-surface);
      padding: 0.8em 1.2em;
      border-radius: 0.5rem;
    }
    .response-text code {
      background: var(--code-bg);
      padding: 0.2em 0.4em;
      border-radius: 0.3rem;
      font-size: 0.85em;
      color: var(--text-primary);
    }
    .response-text pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 0.8rem;
      overflow: auto;
      border: 1px solid var(--border-color);
      margin: 1em 0;
    }
    .response-text pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .response-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 0.9rem;
    }
    .response-text th, .response-text td {
      border: 1px solid var(--table-border);
      padding: 0.6rem 0.8rem;
      text-align: left;
    }
    .response-text th {
      background: var(--table-header-bg);
      font-weight: 600;
      color: var(--text-bright);
    }
    .response-text tr:nth-child(even) {
      background: var(--bg-surface);
    }
    .response-text a {
      color: var(--link-color);
      text-decoration: none;
    }
    .response-text a:hover {
      text-decoration: underline;
    }
    .response-text hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 1.5em 0;
    }
    .response-text img {
      max-width: 100%;
      border-radius: 0.5rem;
    }
    .response-text strong { color: var(--text-bright); }
    .katex-display {
      margin: 1.2em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.5em 0;
      text-align: center;
    }
    .katex {
      font-size: 1.1em;
    }
    .diffusion-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 450;
      background: var(--stat-bg);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      border: 1px solid var(--stat-border);
    }
    .stat-item strong {
      color: var(--text-primary);
      font-weight: 500;
    }
    .action-bar {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1.8rem;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--bg-surface2);
      border: 1px solid var(--border-color);
      border-radius: 40px;
      padding: 0.7rem 1.8rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .btn:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-primary:hover {
      background: #5d6aff;
      transform: scale(1.02);
    }
    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
    }
    .footnote {
      margin-top: 1.2rem;
      text-align: right;
      font-size: 0.65rem;
      color: var(--footer-color);
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }
    .footnote code {
      background: var(--bg-surface);
      padding: 0.1rem 0.6rem;
      border-radius: 12px;
      color: var(--text-secondary);
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }
    .api-status {
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text-secondary);
    }
    .api-status .fa-circle { font-size: 0.4rem; margin-right: 4px; }
    .api-status.connected .fa-circle { color: #4ade80; }
    .api-status.error .fa-circle { color: #f87171; }
    .api-status.loading .fa-circle { color: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (max-width: 820px) {
      .app-wrapper { flex-direction: column; }
      .sidebar { flex: 1 !important; max-height: 200px; position: static; }
      .sidebar.collapsed { flex: 0 !important; max-height: 0; padding: 0; overflow: hidden; opacity: 1; pointer-events: none; }
      .diffusion-view { max-height: 50vh; }
      .sidebar-expand-btn {
        left: 0.5rem;
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <button class="sidebar-expand-btn" id="expandSidebarBtn" title="Expand sidebar">
    <i class="fas fa-chevron-right"></i>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3><i class="fas fa-clock" style="margin-right: 6px;"></i> History</h3>
      <div class="header-actions">
        <button id="clearHistoryBtn" title="clear all"><i class="fas fa-trash-alt"></i></button>
        <button class="toggle-sidebar" id="toggleSidebar" title="collapse sidebar"><i class="fas fa-chevron-left"></i></button>
      </div>
    </div>
    <ul class="history-list" id="historyList">
      <li class="history-empty"><i class="fas fa-comment-slash"></i> No conversations yet</li>
    </ul>
  </aside>

  <div class="card">
    <div class="header">
      <h1><i class="fas fa-brain"></i> text diffusion</h1>
      <span class="badge"><i class="fas fa-microchip"></i> mercury-2</span>
      <span class="api-status" id="apiStatus"><i class="fas fa-circle"></i> API ready</span>
      <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> <span id="themeLabel">Dark</span></button>
    </div>

    <div class="prompt-input-area">
      <div class="prompt-row">
        <div class="prompt-label"><i class="fas fa-pen"></i> prompt</div>
        <div class="prompt-input-wrapper">
          <input type="text" id="promptInput" placeholder="Ask anything about diffusion models..." />
        </div>
        <div class="prompt-actions">
          <button class="btn-icon btn-primary" id="askBtn"><i class="fas fa-paper-plane"></i> Ask</button>
          <button class="btn-icon" id="resetPromptBtn"><i class="fas fa-undo-alt"></i></button>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap;">
        <span class="stage-badge" id="statusBadge"><i class="fas fa-circle" style="font-size:0.5rem; margin-right:4px; color:var(--text-muted);"></i> idle</span>
        <span class="prompt-preview" id="promptPreview">Enter a prompt above</span>
      </div>
    </div>

    <div class="diffusion-view">
      <div class="response-text" id="responseText">
        <span style="opacity:0.4;"><i class="fas fa-comment"></i> type a prompt and press “Ask”</span>
      </div>
    </div>

    <div class="diffusion-stats">
      <div class="stat-item"><i class="fas fa-token"></i> tokens · <strong id="tokenCount">0</strong></div>
      <div class="stat-item"><i class="fas fa-clock"></i> <span id="timeLabel">0.0s</span></div>
      <div class="stat-item"><i class="fas fa-code"></i> README <span style="color:var(--accent);">✓</span></div>
    </div>

    <div class="action-bar">
      <button class="btn" id="resetBtn"><i class="fas fa-rotate-left"></i> reset</button>
      <button class="btn btn-primary" id="diffuseBtn"><i class="fas fa-water"></i> get response</button>
    </div>

    <div class="footnote">
      <i class="fas fa-cloud"></i> Real API · <code>POST /v1/chat/completions</code> 
      <i class="fas fa-arrow-right" style="margin:0 0.4rem;"></i>
      <span id="apiKeyStatus">🔑 API key required</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ⚠️ REPLACE WITH YOUR ACTUAL API KEY
    const API_KEY = 'sk_dccc7aa385cedbc1ffcbdb5f6c9b755a';
    
    // DOM refs
    const promptInput = document.getElementById('promptInput');
    const askBtn = document.getElementById('askBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const diffuseBtn = document.getElementById('diffuseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const responseTextEl = document.getElementById('responseText');
    const tokenCountEl = document.getElementById('tokenCount');
    const timeLabelEl = document.getElementById('timeLabel');
    const statusBadge = document.getElementById('statusBadge');
    const promptPreview = document.getElementById('promptPreview');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const apiStatus = document.getElementById('apiStatus');
    const apiKeyStatus = document.getElementById('apiKeyStatus');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const expandSidebarBtn = document.getElementById('expandSidebarBtn');

    // State
    let currentPrompt = '';
    let chatHistory = [];
    let isCalling = false;
    let sidebarCollapsed = false;

    // Configure marked
    marked.setOptions({
      breaks: true,
      gfm: true,
      tables: true,
      headerIds: false
    });

    // ----- MATH RENDERER (runs on raw text before Markdown) -----
    function renderMath(rawText) {
      // Helper to render a math string with KaTeX
      function renderLatex(math, displayMode) {
        try {
          return katex.renderToString(math.trim(), { displayMode: displayMode, throwOnError: false });
        } catch (e) {
          // If KaTeX fails, return the original raw string with delimiters
          return displayMode ? `\\[${math}\\]` : `\\(${math}\\)`;
        }
      }

      // 1. Handle \[ ... \] display math (standard LaTeX)
      let processed = rawText.replace(/\\\[([\s\S]*?)\\\]/g, function(match, math) {
        return renderLatex(math, true);
      });

      // 2. Handle $$ ... $$ display math
      processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, function(match, math) {
        return renderLatex(math, true);
      });

      // 3. Handle \( ... \) inline math (standard LaTeX)
      processed = processed.replace(/\\\(([\s\S]*?)\\\)/g, function(match, math) {
        return renderLatex(math, false);
      });

      // 4. Handle $ ... $ inline math (but not $$)
      processed = processed.replace(/\$(.+?)\$/g, function(match, math) {
        // Skip if it's already a $$ match (shouldn't happen)
        if (match.startsWith('$$')) return match;
        return renderLatex(math, false);
      });

      return processed;
    }

    // ----- API call -----
    async function callAPI(prompt) {
      const startTime = performance.now();
      
      try {
        apiStatus.className = 'api-status loading';
        apiStatus.innerHTML = `<i class="fas fa-circle"></i> calling...`;
        statusBadge.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> fetching...`;
        responseTextEl.innerHTML = `<span style="opacity:0.6;"><i class="fas fa-spinner fa-pulse"></i> contacting Inception Labs API...</span>`;
        diffuseBtn.disabled = true;
        askBtn.disabled = true;

        const response = await fetch('https://api.inceptionlabs.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'mercury-2',
            reasoning_effort: 'low',
            messages: [
              { role: 'user', content: prompt }
            ]
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`API Error (${response.status}): ${errorText}`);
        }

        const data = await response.json();
        console.log('API Response:', data);
        
        const content = data.choices?.[0]?.message?.content || '';
        if (!content) throw new Error('No content in response');

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        
        // Render math on raw content FIRST, then parse Markdown
        const mathRendered = renderMath(content);
        const finalHtml = marked.parse(mathRendered);
        responseTextEl.innerHTML = finalHtml;
        
        tokenCountEl.textContent = content.length;
        timeLabelEl.textContent = elapsed + 's';
        
        apiStatus.className = 'api-status connected';
        apiStatus.innerHTML = `<i class="fas fa-circle"></i> API ready`;
        statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:var(--accent);"></i> done`;
        
        chatHistory.push({ 
          prompt: prompt, 
          response: content,  // store raw content
          timestamp: Date.now(),
          tokens: content.length
        });
        saveHistory();
        renderHistory();
        
        return content;
        
      } catch (error) {
        console.error('API Error:', error);
        responseTextEl.innerHTML = `<span style="color:#f87171;"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</span>`;
        apiStatus.className = 'api-status error';
        apiStatus.innerHTML = `<i class="fas fa-circle"></i> API error`;
        statusBadge.innerHTML = `<i class="fas fa-circle" style="font-size:0.5rem; margin-right:4px; color:#f87171;"></i> error`;
        throw error;
      } finally {
        isCalling = false;
        diffuseBtn.disabled = false;
        askBtn.disabled = false;
      }
    }

    // ----- Ask -----
    async function askPrompt() {
      if (isCalling) return;
      
      const raw = promptInput.value.trim();
      if (!raw) {
        promptInput.placeholder = 'Please enter a prompt!';
        promptInput.style.borderColor = '#ff5e7a';
        setTimeout(() => { promptInput.style.borderColor = ''; }, 1500);
        return;
      }
      
      currentPrompt = raw;
      promptPreview.textContent = `“${currentPrompt}”`;
      isCalling = true;
      
      await callAPI(currentPrompt);
    }

    // ----- Reset -----
    function fullReset() {
      if (isCalling) return;
      responseTextEl.innerHTML = `<span style="opacity:0.4;"><i class="fas fa-comment"></i> type a prompt and press “Ask”</span>`;
      tokenCountEl.textContent = '0';
      timeLabelEl.textContent = '0.0s';
      statusBadge.innerHTML = `<i class="fas fa-circle" style="font-size:0.5rem; margin-right:4px; color:var(--text-muted);"></i> idle`;
      promptPreview.textContent = 'Enter a prompt above';
    }

    // ----- History -----
    function loadHistory() {
      try {
        const stored = localStorage.getItem('diffusion_chat_math_fixed');
        if (stored) chatHistory = JSON.parse(stored);
      } catch (_) { chatHistory = []; }
      renderHistory();
    }
    function saveHistory() {
      try {
        localStorage.setItem('diffusion_chat_math_fixed', JSON.stringify(chatHistory));
      } catch (_) {}
    }
    function renderHistory() {
      historyList.innerHTML = '';
      if (!chatHistory.length) {
        historyList.innerHTML = `<li class="history-empty"><i class="fas fa-comment-slash"></i> No conversations yet</li>`;
        return;
      }
      const reversed = [...chatHistory].reverse();
      for (const entry of reversed) {
        const li = document.createElement('li');
        li.className = 'history-item';
        const timeStr = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        li.innerHTML = `
          <i class="fas fa-message" style="color:var(--text-muted);"></i>
          <span class="h-prompt">${escapeHtml(entry.prompt)}</span>
          <span class="h-time">${timeStr}</span>
          <button class="h-del" data-prompt="${escapeHtml(entry.prompt)}" title="delete"><i class="fas fa-xmark"></i></button>
        `;
        li.addEventListener('click', function(e) {
          if (e.target.closest('.h-del')) return;
          promptInput.value = entry.prompt;
          currentPrompt = entry.prompt;
          // Render math then markdown
          const mathRendered = renderMath(entry.response);
          const finalHtml = marked.parse(mathRendered);
          responseTextEl.innerHTML = finalHtml;
          tokenCountEl.textContent = entry.response.length;
          promptPreview.textContent = `“${currentPrompt}”`;
          statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:var(--accent);"></i> loaded`;
        });
        const delBtn = li.querySelector('.h-del');
        delBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          const p = this.getAttribute('data-prompt');
          chatHistory = chatHistory.filter(h => h.prompt !== p);
          saveHistory();
          renderHistory();
        });
        historyList.appendChild(li);
      }
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ----- Sidebar toggle -----
    function collapseSidebar() {
      sidebarCollapsed = true;
      sidebar.classList.add('collapsed');
      toggleSidebar.innerHTML = '<i class="fas fa-chevron-right"></i>';
      expandSidebarBtn.classList.add('visible');
      localStorage.setItem('sidebar_collapsed', 'true');
    }

    function expandSidebar() {
      sidebarCollapsed = false;
      sidebar.classList.remove('collapsed');
      toggleSidebar.innerHTML = '<i class="fas fa-chevron-left"></i>';
      expandSidebarBtn.classList.remove('visible');
      localStorage.setItem('sidebar_collapsed', 'false');
    }

    function toggleSidebarCollapse() {
      if (sidebarCollapsed) {
        expandSidebar();
      } else {
        collapseSidebar();
      }
    }

    // ----- Theme -----
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      themeLabel.textContent = next === 'dark' ? 'Dark' : 'Light';
      themeToggle.innerHTML = next === 'dark' ? `<i class="fas fa-moon"></i> <span id="themeLabel">Dark</span>` : `<i class="fas fa-sun"></i> <span id="themeLabel">Light</span>`;
      localStorage.setItem('diffusion_theme_math_fixed', next);
    }
    function loadTheme() {
      const saved = localStorage.getItem('diffusion_theme_math_fixed');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        themeLabel.textContent = saved === 'dark' ? 'Dark' : 'Light';
        themeToggle.innerHTML = saved === 'dark' ? `<i class="fas fa-moon"></i> <span id="themeLabel">Dark</span>` : `<i class="fas fa-sun"></i> <span id="themeLabel">Light</span>`;
      }
    }

    // ----- Events -----
    askBtn.addEventListener('click', askPrompt);
    diffuseBtn.addEventListener('click', askPrompt);
    resetBtn.addEventListener('click', fullReset);
    
    resetPromptBtn.addEventListener('click', function() {
      promptInput.value = '';
      currentPrompt = '';
      promptPreview.textContent = 'Enter a prompt above';
      fullReset();
    });

    promptInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); askBtn.click(); }
    });

    clearHistoryBtn.addEventListener('click', function() {
      if (confirm('Clear all history?')) {
        chatHistory = [];
        saveHistory();
        renderHistory();
      }
    });

    themeToggle.addEventListener('click', toggleTheme);
    toggleSidebar.addEventListener('click', toggleSidebarCollapse);
    expandSidebarBtn.addEventListener('click', expandSidebar);

    // ----- Init -----
    loadTheme();
    loadHistory();
    
    const sidebarState = localStorage.getItem('sidebar_collapsed');
    if (sidebarState === 'true') {
      collapseSidebar();
    } else {
      expandSidebar();
    }
    
    if (!API_KEY || API_KEY === 'sk_dccc7aa385cedbc1ffcbdb5f6c9b755a') {
      apiKeyStatus.textContent = '⚠️ Replace with your API key';
      apiStatus.className = 'api-status error';
      apiStatus.innerHTML = `<i class="fas fa-circle"></i> API key missing`;
    } else {
      apiKeyStatus.textContent = '🔑 API key configured';
      apiStatus.className = 'api-status connected';
      apiStatus.innerHTML = `<i class="fas fa-circle"></i> API ready`;
    }
  })();
</script>
</body>
</html>
